name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install check dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq ffmpeg inotify-tools python3-numpy python3-pil fontconfig fonts-dejavu-core
      - name: Syntax, static analysis, and regression tests
        run: setup/check.sh
