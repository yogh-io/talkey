# talkey bindings for i3.
#
# talkey itself does not need i3 - see ../bindings/ for sxhkd and xbindkeys,
# which work under any X11 window manager. This file is the i3 flavour.
#
# Copy it next to your i3 config and include the copy - the keycodes below are
# yours to edit, and a package upgrade would overwrite the original:
#
#   cp /usr/share/talkey/bindings/i3.conf ~/.config/i3/talkey.conf
#   echo 'include ~/.config/i3/talkey.conf' >> ~/.config/i3/config
#
# Hold-to-talk: press starts recording, release acts. `bindcode` binds the raw
# X11 keycode (works even for special keys that emit no keysym). The
# `xset -r <keycode>` lines kill X11 auto-repeat on those keys, so a held key
# is one clean press + one release instead of a machine-gun of events.

# --- your keycodes: the ONLY lines you should need to edit -------------------
# The defaults are a Keychron K10's media keys. Find yours with:
#   xev | grep --line-buffered -oP 'keycode\s+\d+.*'
# Press each key (with the xev window focused) and read the number after
# "keycode", then set it here.
#
# Keep these lines bare. i3 takes everything after the variable name as the
# value and does NOT strip comments, so a trailing "# note" ends up inside the
# keycode and every binding using it breaks.
#
# X key -> dictate in your main language
set $key_dictate 194
# Tools key -> dictate in your second language. Which language that is lives in
# ~/.config/talkey/talkey.env as TALKEY_LANG2, not here - so it is named once.
# Leave TALKEY_LANG2 unset and this key simply says so instead of dictating in
# the wrong language.
set $key_dictate_alt 191
# Square key -> double-tap restart / live translation / memo
set $key_memo 193
# Triangle key -> submit (Enter); double-tap toggles persistent auto Enter
set $key_submit 192
# Mouse thumb buttons, for the mouse-only bindings near the bottom. X numbers
# them 8 (back) and 9 (forward) on most mice - NOT 4/5, which are the wheel.
set $btn_dictate button8
set $btn_submit button9
# The help cheat-sheet shortcut. Mod4 is Super; $mod is whatever your i3 config
# set it to, which is why this uses Mod4 explicitly.
set $key_help Mod4+c
# ----------------------------------------------------------------------------

# --- talkey's eww windows: floating, on every workspace, on top, and NEVER
#     focused (critical - xdotool must keep typing into your real window).
#     Matched by TITLE, not class: every eww window shares the class "Eww", so a
#     class rule would also seize an eww bar or widgets you run yourself. eww
#     titles its windows "Eww - <name>". The windows place themselves via their
#     own geometry, so do NOT `move position center` here - that fights it. ---
no_focus [title="^Eww - talkey(hud|help)$"]
for_window [title="^Eww - talkey(hud|help)$"] floating enable, sticky enable, border pixel 0

# The renderer: watches the state files and opens/closes those windows.
# Single-instance via flock, so exec_always is safe across reloads. If you would
# rather not rely on your WM to start it, enable the user service instead:
#   systemctl --user enable --now talkey-hud
exec_always --no-startup-id talkey-hud

# --- disable auto-repeat on the keys (runs on every i3 reload) ---
exec_always --no-startup-id xset -r $key_dictate
exec_always --no-startup-id xset -r $key_dictate_alt
exec_always --no-startup-id xset -r $key_memo
exec_always --no-startup-id xset -r $key_submit

# The lines above fix it on reload, but X re-enables auto-repeat whenever the
# keyboard re-enumerates (Bluetooth reconnect, USB replug, sleep/wake). This
# watcher reapplies `xset -r` for these keycodes on every input-device add, so
# it survives reconnects. exec_always so a reload can start it; the script holds
# a lock and exits if an instance is already running, so reloads never stack.
exec_always --no-startup-id talkey-norepeat $key_dictate $key_dictate_alt $key_memo $key_submit

# --- dictate: tap to toggle, or hold to talk; types on stop ---
bindcode           $key_dictate exec --no-startup-id talkey dictate press
bindcode --release $key_dictate exec --no-startup-id talkey dictate release

# --- dictate in your second language (TALKEY_LANG2 in talkey.env) ---
bindcode           $key_dictate_alt exec --no-startup-id talkey dictate-alt press
bindcode --release $key_dictate_alt exec --no-startup-id talkey dictate-alt release

# --- memo key: mid-dictation, two taps within TALKEY_DOUBLE_TAP_MS restart the
#     dictation (discards the clip so far, records again). Otherwise hold to
#     record a memo and release to play it back, or double-tap to switch live
#     translation (talkey translate) on or off. (Cancel lives on the submit-key
#     cycle.) ---
bindcode           $key_memo exec --no-startup-id talkey memo press
bindcode --release $key_memo exec --no-startup-id talkey memo release

# --- submit: idle tap = Enter; during a dictation, tap cycles what happens when
#     the dictation ends (send / cancel / plain). Double-tap toggles auto Enter. ---
bindcode $key_submit exec --no-startup-id talkey submit

# --- mouse thumb buttons (e.g. Logitech G502 left-side buttons) ---
# The two side/thumb buttons give a mouse-only dictate + submit, mirroring the
# keyboard keys above. X11 numbers the thumb buttons 8 (back) and 9 (forward) on
# most mice - NOT 4/5, which are the scroll wheel. Confirm yours with:
#   xev | grep --line-buffered -oP 'button \d+'
# then click each thumb button and swap the numbers below if they feel reversed.
# `--whole-window` grabs the click anywhere over a window, not just its titlebar;
# note this DEDICATES the buttons to talkey, so they stop doing browser
# back/forward. Mouse buttons don't auto-repeat, so no xset/talkey-norepeat needed.
# Commented out by default - uncomment if you want them.
#
# button 8: hold to talk, release types (same gesture as the dictate key)
# bindsym --whole-window           $btn_dictate exec --no-startup-id talkey dictate press
# bindsym --whole-window --release $btn_dictate exec --no-startup-id talkey dictate release
# button 9: press = submit (Enter); during a dictation, queues after the text lands
# bindsym --whole-window           $btn_submit exec --no-startup-id talkey submit

# --- help cheat-sheet overlay ---
bindsym $key_help exec --no-startup-id talkey help
